services:
  proxy:
    build: ./proxy
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy

  cron:
    build: ./cron
    env_file: .env
    profiles: [tools]

volumes:
  caddy_data:
  caddy_config:
