name: Sync env

on:
  workflow_dispatch:

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write TWELVE_DATA_API_KEY to the VPS .env
        uses: appleboy/ssh-action@v1
        env:
          TD_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TD_KEY
          script: |
            set -e
            cd /opt/near-ai-agent-market
            if [ -z "$TD_KEY" ]; then echo "TWELVE_DATA_API_KEY secret is empty"; exit 1; fi
            touch .env
            grep -v '^TWELVE_DATA_API_KEY=' .env > .env.next || true
            printf 'TWELVE_DATA_API_KEY=%s\n' "$TD_KEY" >> .env.next
            mv .env.next .env
            chmod 600 .env
            docker compose up -d --force-recreate proxy
            docker compose ps proxy
