name: Sync env

on:
  workflow_dispatch:

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to the VPS .env
        uses: appleboy/ssh-action@v1
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEAR_AGENT_TOKEN: ${{ secrets.NEAR_AGENT_TOKEN }}
          NEAR_WEBHOOK_SECRET: ${{ secrets.NEAR_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TWELVE_DATA_API_KEY,NEAR_AGENT_TOKEN,NEAR_WEBHOOK_SECRET
          script: |
            set -e
            cd /opt/near-ai-agent-market
            if [ -z "$TWELVE_DATA_API_KEY" ]; then echo "TWELVE_DATA_API_KEY secret is empty"; exit 1; fi
            touch .env
            for name in TWELVE_DATA_API_KEY NEAR_AGENT_TOKEN NEAR_WEBHOOK_SECRET; do
              value=$(printenv "$name" || true)
              if [ -z "$value" ]; then continue; fi
              grep -v "^$name=" .env > .env.next || true
              printf '%s=%s\n' "$name" "$value" >> .env.next
              mv .env.next .env
            done
            chmod 600 .env
            docker compose up -d --force-recreate proxy
            docker compose ps proxy
